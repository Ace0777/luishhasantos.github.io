<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Henrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --muted: rgba(255,255,255,0.45);
    --border: rgba(255,255,255,0.11);
    --pill-bg: #19191c;
    --pill-bg-hover: #212126;
    --field-bg: #141416;
  }

  html, body {
    min-height: 100vh;
    background: #060606;
    color: var(--white);
    font-family: "Satoshi", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .anim { opacity: 0; animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .delay-0 { animation-delay: 0s; }
  .delay-1 { animation-delay: 0.12s; }
  .delay-2 { animation-delay: 0.26s; }
  .delay-3 { animation-delay: 0.42s; }
  .delay-4 { animation-delay: 0.58s; }
  .delay-5 { animation-delay: 0.74s; }
  .delay-6 { animation-delay: 0.9s; }

  .page {
    width: 100%;
    max-width: 820px;
    padding: 3rem 1.75rem;
    text-align: center;
  }

  .mark {
    width: 34px;
    height: 34px;
    margin: 0 auto 1.9rem;
    color: rgba(255,255,255,0.85);
    animation: iconFloat 4.5s ease-in-out infinite;
  }
  .mark svg { width: 100%; height: 100%; }

  h1 {
    font-size: clamp(2.6rem, 6.2vw, 5.2rem);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--white);
    margin-bottom: 1.9rem;
  }

  .pills {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-bottom: 1.9rem;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--white);
    text-decoration: none;
    background: var(--pill-bg);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.18s ease, transform 0.15s ease;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(8px);
    animation: pillIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes pillIn { to { opacity: 1; transform: translateY(0); } }
  .pill:nth-child(1) { animation-delay: 0.62s; }
  .pill:nth-child(2) { animation-delay: 0.7s; }
  .pill:nth-child(3) { animation-delay: 0.78s; }
  .pill:nth-child(4) { animation-delay: 0.86s; }

  .pill:hover { background: var(--pill-bg-hover); transform: translateY(-1px); }

  .pill-icon {
    width: 16px; height: 16px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pill-icon.ig { background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fdf497 5%, #fd5949 45%, #d6249f 60%, #285AEB 90%); }
  .pill-icon.li { background: #0a66c2; border-radius: 4px; }
  .pill-icon.gh { background: #161b22; border: 1px solid rgba(255,255,255,0.15); }
  .pill-icon.mail { background: var(--blue-dim); border: 1px solid var(--blue-border); border-radius: 5px; }

  .sub {
    font-size: clamp(0.98rem, 2.3vw, 1.08rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 1.8rem;
    max-width: 580px;
    margin-left: auto;
    margin-right: auto;
  }

  .signup {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 2.8rem;
    flex-wrap: wrap;
  }

  .signup input {
    background: var(--field-bg);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--white);
    padding: 0.75rem 1.1rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.92rem;
    width: 240px;
    outline: none;
    transition: border-color 0.18s ease;
  }
  .signup input::placeholder { color: rgba(255,255,255,0.32); }
  .signup input:focus { border-color: rgba(255,255,255,0.28); }

  .signup button {
    background: var(--white);
    color: #0a0a0a;
    border: none;
    padding: 0.75rem 1.4rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.18s ease, transform 0.15s ease;
  }
  .signup button:hover { opacity: 0.88; transform: translateY(-1px); }
  .signup button:disabled { opacity: 0.6; cursor: default; transform: none; }

  .signup-msg {
    min-height: 1.1rem;
    font-size: 0.82rem;
    margin: -1.6rem 0 2.2rem;
    color: var(--muted);
  }
  .signup-msg.ok { color: #4fd68c; }
  .signup-msg.err { color: #ff6a6a; }

  footer {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.2);
    font-weight: 400;
  }

  @media (max-width: 480px) {
    .page { padding: 2.5rem 1.25rem; }
    .signup input { width: 100%; max-width: 280px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .anim, .pill { animation-duration: 0.01s !important; }
    .mark { animation: none; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="mark anim delay-0">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="15" cy="20" r="8.2" stroke="currentColor" stroke-width="1.5"/>
      <circle cx="25" cy="20" r="8.2" stroke="currentColor" stroke-width="1.5"/>
    </svg>
  </div>

  <h1 class="anim delay-2">I turn ideas into code.</h1>

  <div class="pills">

    <a href="https://www.instagram.com/luishhsantos/" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon ig">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="white">
          <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
      </span>
      @luishhsantos
    </a>

    <a href="https://www.linkedin.com/in/luis-henrique-hilario/" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon li">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="white">
          <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
        </svg>
      </span>
      @luishhsantos
    </a>

    <a href="https://github.com/Ace0777" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon gh">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="white">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
      </span>
      Ace0777
    </a>

  </div>

  <p class="sub anim delay-3">
    Developer focused on building clean, functional products. From concept to deployment make things work and look good doing it.
  </p>

  <form class="signup anim delay-5" id="signupForm">
    <input type="email" name="email" placeholder="name@email.com" required />
    <input type="hidden" name="access_key" value="62f77776-8b1d-4f68-a6b6-a577d9d8817d" />
    <input type="hidden" name="subject" value="Novo cadastro — luishhsantos.github.io" />
    <input type="hidden" name="from_name" value="Portfólio Luis Henrique" />
    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />
    <button type="submit">Sign up</button>
  </form>
  <p class="signup-msg" id="signupMsg" aria-live="polite"></p>

  <footer class="anim delay-6">© 2025 Luis Henrique</footer>

</div>

<script>
  const form = document.getElementById('signupForm');
  const msg = document.getElementById('signupMsg');
  const btn = form.querySelector('button');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = 'Enviando...';
    msg.textContent = '';
    msg.className = 'signup-msg';

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      const data = await res.json();

      if (data.success) {
        msg.textContent = 'Cadastrado! Valeu 🙌';
        msg.classList.add('ok');
        form.reset();
      } else {
        throw new Error(data.message || 'Falha no envio');
      }
    } catch (err) {
      msg.textContent = 'Não deu pra enviar agora, tenta de novo.';
      msg.classList.add('err');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign up';
    }
  });
</script>
</body>
</html>
