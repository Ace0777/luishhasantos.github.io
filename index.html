<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis Henrique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --white: #ffffff;
    --muted: rgba(255,255,255,0.45);
    --border: rgba(255,255,255,0.11);
    --pill-bg: #19191c;
    --pill-bg-hover: #212126;
    --field-bg: #141416;
  }

  html, body {
    min-height: 100vh;
    background: #060606;
    color: var(--white);
    font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes iconFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-3px); }
  }

  .anim { opacity: 0; animation: fadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  .delay-0 { animation-delay: 0s; }
  .delay-1 { animation-delay: 0.12s; }
  .delay-2 { animation-delay: 0.26s; }
  .delay-3 { animation-delay: 0.42s; }
  .delay-4 { animation-delay: 0.58s; }
  .delay-5 { animation-delay: 0.74s; }
  .delay-6 { animation-delay: 0.9s; }

  .page {
    width: 100%;
    max-width: 900px;
    padding: 3rem 1.75rem;
    text-align: center;
  }

  .mark {
    width: 62px;
    height: 62px;
    margin: 0 auto 1.9rem;
    color: rgba(255,255,255,0.85);
  }
  .mark path {
    stroke-dasharray: 158;
    stroke-dashoffset: 158;
    animation: markCycle 9s ease-in-out 0.3s infinite;
  }
  @keyframes markCycle {
    0%   { stroke-dashoffset: 158; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    16%  { stroke-dashoffset: 0; animation-timing-function: linear; }
    56%  { stroke-dashoffset: 0; animation-timing-function: cubic-bezier(0.65, 0, 0.35, 1); }
    70%  { stroke-dashoffset: 158; animation-timing-function: linear; }
    100% { stroke-dashoffset: 158; }
  }
  .mark svg { width: 100%; height: 100%; }

  h1 {
    font-size: clamp(2.3rem, 4.8vw, 3.7rem);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--white);
    margin-bottom: 1.9rem;
  }

  @media (min-width: 640px) {
    h1 { white-space: nowrap; }
  }

  .pills {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.55rem;
    margin-bottom: 1.9rem;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.42rem 0.85rem;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--white);
    text-decoration: none;
    background: var(--pill-bg);
    border: 1px solid rgba(255,255,255,0.06);
    transition: background 0.18s ease, transform 0.15s ease;
    white-space: nowrap;
    opacity: 0;
    transform: translateY(8px);
    animation: pillIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }
  @keyframes pillIn { to { opacity: 1; transform: translateY(0); } }
  .pill:nth-child(1) { animation-delay: 0.62s; }
  .pill:nth-child(2) { animation-delay: 0.7s; }
  .pill:nth-child(3) { animation-delay: 0.78s; }
  .pill:nth-child(4) { animation-delay: 0.86s; }

  .pill:hover { background: var(--pill-bg-hover); transform: translateY(-1px); }

  .pill-icon {
    width: 19px; height: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .pill-icon.li-text {
    font-weight: 800;
    font-size: 16px;
    line-height: 1;
    letter-spacing: -0.5px;
    color: #0a66c2;
  }
  .pill-icon.mail { background: var(--blue-dim); border: 1px solid var(--blue-border); border-radius: 5px; }

  .sub {
    font-size: clamp(0.98rem, 2.3vw, 1.08rem);
    font-weight: 400;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 1.8rem;
    max-width: 580px;
    margin-left: auto;
    margin-right: auto;
  }

  .signup {
    display: flex;
    justify-content: center;
    gap: 0.6rem;
    margin-bottom: 2.8rem;
    flex-wrap: wrap;
  }

  .signup input {
    background: var(--field-bg);
    border: 1px solid rgba(255,255,255,0.09);
    color: var(--white);
    padding: 0.75rem 1.1rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.92rem;
    width: 240px;
    outline: none;
    transition: border-color 0.18s ease;
  }
  .signup input::placeholder { color: rgba(255,255,255,0.32); }
  .signup input:focus { border-color: rgba(255,255,255,0.28); }

  .signup button {
    background: var(--white);
    color: #0a0a0a;
    border: none;
    padding: 0.75rem 1.4rem;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.18s ease, transform 0.15s ease;
    min-width: 96px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .signup button:hover { opacity: 0.88; transform: translateY(-1px); }
  .signup button:disabled { opacity: 0.7; cursor: default; transform: none; }

  .spinner {
    display: block;
    width: 14px;
    height: 14px;
    border: 1.5px solid rgba(10,10,10,0.22);
    border-top-color: #0a0a0a;
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .btn-label {
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .signup-success {
    font-size: clamp(1.2rem, 2.6vw, 1.5rem);
    font-weight: 600;
    color: var(--white);
    margin-bottom: 2.8rem;
    opacity: 0;
    animation: fadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .signup-msg {
    min-height: 1.1rem;
    font-size: 0.82rem;
    margin: -1.6rem 0 2.2rem;
    color: var(--muted);
  }
  .signup-msg.err { color: #ff6a6a; }

  footer {
    font-size: 0.78rem;
    color: rgba(255,255,255,0.2);
    font-weight: 400;
  }

  @media (max-width: 480px) {
    .page { padding: 3.5rem 1.5rem; }

    .mark { margin-bottom: 2.2rem; }

    h1 {
      font-size: clamp(2.5rem, 9.5vw, 3.4rem);
      white-space: normal;
      margin-bottom: 2.3rem;
    }

    .pills {
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2.4rem;
    }
    .pill { font-size: 0.88rem; padding: 0.52rem 1rem; }

    .sub { margin-bottom: 2.4rem; }

    .signup { flex-wrap: nowrap; margin-bottom: 3.2rem; }
    .signup input { flex: 1; min-width: 0; width: auto; }
    .signup button { flex-shrink: 0; min-width: auto; padding: 0.75rem 1.1rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .anim, .pill { animation-duration: 0.01s !important; }
    .mark path { animation: none; stroke-dashoffset: 0; }
  }
</style>
</head>
<body>

<div class="page">

  <div class="mark">
    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 10h9v6H9v4h6v-6h10v6h-6v4h6v10h-9v-6h6v-4h-6v6H6V20h6v-4H6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
    </svg>
  </div>

  <h1 class="anim delay-2">I turn ideas into code.</h1>

  <div class="pills">

    <a href="https://www.instagram.com/luishhsantos/" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon">
        <svg width="19" height="19" viewBox="0 0 24 24">
          <defs>
            <linearGradient id="igGrad" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#fdf497"/>
              <stop offset="15%" stop-color="#fdf497"/>
              <stop offset="45%" stop-color="#fd5949"/>
              <stop offset="60%" stop-color="#d6249f"/>
              <stop offset="90%" stop-color="#285AEB"/>
            </linearGradient>
          </defs>
          <path fill="url(#igGrad)" d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
        </svg>
      </span>
      @luishhsantos
    </a>

    <a href="https://www.linkedin.com/in/luis-henrique-hilario/" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon li-text">in</span>
      @luishhsantos
    </a>

    <a href="https://github.com/Ace0777" target="_blank" rel="noopener" class="pill">
      <span class="pill-icon">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="white">
          <path d="M12 0C5.374 0 0 5.373 0 12c0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23A11.509 11.509 0 0112 5.803c1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.797 24 17.3 24 12c0-6.627-5.373-12-12-12z"/>
        </svg>
      </span>
      Ace0777
    </a>

  </div>

  <p class="sub anim delay-3">
    Developer focused on building clean, functional products. From concept to deployment make things work and look good doing it.
  </p>

  <div id="signupWrap">
    <form class="signup anim delay-5" id="signupForm">
      <input type="email" name="email" placeholder="name@email.com" required />
      <input type="hidden" name="access_key" value="62f77776-8b1d-4f68-a6b6-a577d9d8817d" />
      <input type="hidden" name="subject" value="Novo cadastro — luishhsantos.github.io" />
      <input type="hidden" name="from_name" value="Portfólio Luis Henrique" />
      <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off" />
      <button type="submit"><span class="btn-label">Sign up</span></button>
    </form>
    <p class="signup-msg" id="signupMsg" aria-live="polite"></p>
  </div>

  <footer class="anim delay-6">© 2026 Luis Henrique</footer>

</div>

<script>
  const form = document.getElementById('signupForm');
  const wrap = document.getElementById('signupWrap');
  const msg = document.getElementById('signupMsg');
  const btn = form.querySelector('button');
  const btnLabel = btn.querySelector('.btn-label');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btnLabel.innerHTML = '<span class="spinner"></span>';
    msg.textContent = '';
    msg.className = 'signup-msg';

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify(Object.fromEntries(new FormData(form))),
      });
      const data = await res.json();

      if (data.success) {
        wrap.innerHTML = '<p class="signup-success">I\'ll be in touch.</p>';
      } else {
        throw new Error(data.message || 'Failed to send');
      }
    } catch (err) {
      msg.textContent = 'Não deu pra enviar agora, tenta de novo.';
      msg.classList.add('err');
      btn.disabled = false;
      btnLabel.textContent = 'Sign up';
    }
  });
</script>
</body>
</html>
